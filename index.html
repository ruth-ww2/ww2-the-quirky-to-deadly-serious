<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WW2: The Quirky to Deadly Serious</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #2c2c2c;
      background-color: #000;
    }

    header {
      width: 100%;
      min-height: 400px;
      background: url('banner-placeholder.jpg') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #cc0000;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    header h2 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #000;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      text-align: center;
      font-weight: 400;
      line-height: 1.4;
      text-shadow: 2px 2px 0 rgb(0 0 0 / 0.4);
    }

    header p {
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      text-align: center;
      text-shadow: 2px 2px 0 #fff;
      margin-top: 0.5rem;
      font-weight: 600;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 24px;
      text-align: center;
    }

    main img {
      width: 100%;
      max-width: 431px;
      height: auto;
    }

    main .book-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 910px) {
      main .book-row {
        flex-direction: row;
        justify-content: center;
      }
    }

    main p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <h1>WWII &ndash; from the Quirky to the Deadly Serious</h1>
    <h2>revealed in three one-of-a-kind books</h2>
    <p>by Ruth Sabath Rosenthal</p>
  </header>

  <main>
    <a href="placeholder-file.pdf" target="_blank" rel="noopener">
      <img src="https://placehold.co/431x643?text=On+a+Ship+to+America%2C+July+1944" alt="On a Ship to America, July 1944" width="431" height="643" loading="lazy" decoding="async">
    </a>
    <div class="book-row">
        <a href="placeholder-file.pdf" target="_blank" rel="noopener">
            <img src="https://placehold.co/431x643?text=Art%2C+Jewelry%2C+Gold+Stolen+by+the+Nazis+During+World+War+II+and+Recovered+by+the+U.S.+and+Its+Allies" alt="Art, Jewelry, Gold Stolen by the Nazis During World War II and Recovered by the U.S. and Its Allies" width="431" height="643" loading="lazy" decoding="async">
        </a>
        <a href="manfred.pdf" target="_blank" rel="noopener">
            <img src="manfred-cover.jpg" alt="Manfred" width="431" height="643" loading="lazy" decoding="async">
        </a>
    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> WW2: The Quirky to Deadly Serious
  </footer>
</body>
</html>
