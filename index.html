<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WW2: The Quirky to Deadly Serious</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #2c2c2c;
      background-color: #f5f0e8;
    }

    header {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 360px;
      overflow: hidden;
    }

    header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    header .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.65));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 {
      color: #fff;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      padding: 0 1rem;
      line-height: 1.3;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    main p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <img src="banner-placeholder.jpg" alt="WW2 banner image">
    <div class="overlay">
      <h1>WW2: The Quirky to Deadly Serious</h1>
    </div>
  </header>

  <main>
    <p>Stories from the Second World War — the strange, the surprising, and the sobering. Coming soon.</p>
  </main>

  <footer>
    &copy; 2026 WW2: The Quirky to Deadly Serious
  </footer>
</body>
</html>
