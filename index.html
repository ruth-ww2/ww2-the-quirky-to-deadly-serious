<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WW2: The Quirky to Deadly Serious</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #2c2c2c;
      background-color: #323233;
    }

    .hero-three-col {
      --hero-side-ratio: 640 / 800;
      --hero-side-width: clamp(140px, 22vw, 340px);
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      background-color: #f5f5f5;
    }

    .hero-side {
      flex: 0 0 var(--hero-side-width);
      aspect-ratio: var(--hero-side-ratio);
      overflow: hidden;
    }

    .hero-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-middle {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      background: url('header-center-wide-v2.webp') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem 0 6rem;
    }

    .hero-middle h1 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #cc0000;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .hero-middle h2 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #000;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 400;
      line-height: 1.4;
      text-shadow: 2px 2px 0 rgb(0 0 0 / 0.4);
    }

    .hero-middle p {
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      /* text-shadow: 2px 2px 0 #fff; */
      margin-top: 0.5rem;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .hero-three-col {
        --hero-side-width: clamp(90px, 20vw, 180px);
        gap: 0.6rem;
        padding: 1rem 0.5rem;
      }

      .hero-middle {
        padding: 1rem;
      }
    }

    header {
      width: 100%;
      min-height: 400px;
      background: url('banner-bg.webp') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #cc0000;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    header h2 {
      font-family: 'Libre Baskerville', 'Lucida Bright', Georgia, serif;
      color: #000;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      text-align: center;
      font-weight: 400;
      line-height: 1.4;
      text-shadow: 2px 2px 0 rgb(0 0 0 / 0.4);
    }

    header p {
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      text-align: center;
      text-shadow: 2px 2px 0 #fff;
      margin-top: 0.5rem;
      font-weight: 600;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 24px;
      text-align: center;
    }

    main img {
      width: 100%;
      max-width: 431px;
      height: auto;
    }

    main .book-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 910px) {
      main .book-row {
        flex-direction: row;
        justify-content: center;
      }
    }

    main p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="hero-three-col" style="position:relative;z-index:1;">
    <div class="hero-side">
      <img src="header-left-v2.webp" alt="Header Left" width="640" height="800" decoding="async">
    </div>

    <div class="hero-middle">
      <h1>WWII &ndash; <i>from the Quirky to the Deadly Serious</i></h1>
      <h2>revealed in three one-of-a-kind books</h2>
      <p>by Ruth Sabath Rosenthal</p>
    </div>

    <div class="hero-side">
      <img src="header-right-v2.webp" alt="Header Right" width="640" height="800" decoding="async">
    </div>

    <div style="position:absolute; top:0; right:4vw; width:100%; max-width:215px;">
      <img src="plane-v1.png" alt="Plane" width="281" height="56" style="width:100%; height:auto;" />
    </div>
  </div>

  <main>
    <a href="placeholder-file.pdf" target="_blank" rel="noopener">
      <img src="on-a-ship-to-america.jpg" alt="On a Ship to America, July 1944" width="490" height="638" loading="lazy" decoding="async">
    </a>
    <div class="book-row">
        <a href="placeholder-file.pdf" target="_blank" rel="noopener">
            <img src="art-jewelry-gold.jpg" alt="Art, Jewelry, Gold Stolen by the Nazis During World War II and Recovered by the U.S. and Its Allies" width="445" height="668" loading="lazy" decoding="async">
        </a>
        <a href="manfred.pdf" target="_blank" rel="noopener">
            <img src="manfred-cover.jpg" alt="Manfred" width="431" height="643" loading="lazy" decoding="async">
        </a>
    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> WW2: The Quirky to Deadly Serious
  </footer>
</body>
</html>
